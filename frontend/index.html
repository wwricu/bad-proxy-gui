<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Proxy GUI</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div id="app">
        <!-- Node list: the whole window above the bar. -->
        <div class="left-panel">
            <div id="nodeList" class="node-list"></div>
        </div>
    </div>

    <!-- Three zones, left to right: what you can do, what just happened, what
         is running. The actions are the fixed corner the eye starts at; the
         facts are the fixed corner at the other end; the one element whose
         width changes sits in the middle, where it can only ever clip itself. -->
    <div class="status-bar">
        <div class="bar-actions">
            <button id="gearBtn" class="icon-btn" title="Settings" aria-label="Settings">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
            <button id="addNodeBtn" class="icon-btn" title="Add a node" aria-label="Add a node">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </button>
        </div>
        <span id="statusText" class="status"></span>
        <div class="readout">
            <label>HTTP</label><span id="roHttp"></span>
        </div>
        <div class="readout">
            <label>SOCKS</label><span id="roSocks"></span>
        </div>
        <div class="readout">
            <label>MODE</label><span id="roMode"></span>
        </div>
        <div class="readout">
            <label>ROUTING</label><span id="roRouting"></span>
        </div>
    </div>

    <!-- The node editor and the settings form are windows of their own, opened
         through the backend; this page keeps only the confirmation, which is one
         sentence about a row drawn right here. -->
    <div class="overlay" id="deleteSheet" hidden>
        <div class="sheet sheet-narrow" role="alertdialog" aria-modal="true" aria-labelledby="deleteQuestion">
            <div class="sheet-body">
                <p id="deleteQuestion" class="sheet-copy"></p>
            </div>
            <div class="sheet-actions">
                <button id="deleteCancel" class="btn-secondary">Cancel</button>
                <button id="deleteOK" class="btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- Node context menu: the fallback where the OS menu is not available
         (macOS/Linux). Windows pops a real Win32 menu instead. -->
    <div id="ctxMenu" class="ctx-menu" style="display:none;">
        <div class="ctx-item" id="ctxEdit">Edit</div>
        <div class="ctx-item" id="ctxTest">Test</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item danger" id="ctxDelete">Delete</div>
    </div>

    <script type="module" src="/wails/runtime.js"></script>
    <script type="module" src="src/app.js"></script>
</body>
</html>
