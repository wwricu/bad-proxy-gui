<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Proxy GUI</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div id="app">
        <!-- Node list: the whole window above the bar. Every setting lives in
             the settings window the gear opens. -->
        <div class="left-panel">
            <div id="nodeList" class="node-list"></div>
            <div id="addNodeRow" class="add-node-row">+ Add node</div>
        </div>
    </div>

    <!-- Read-only status bar: what the engine is listening on, which mode and
         routing preset it runs, and the door to the settings window. -->
    <div class="status-bar">
        <div class="readout">
            <label>HTTP</label><span id="roHttp"></span>
        </div>
        <div class="readout">
            <label>SOCKS</label><span id="roSocks"></span>
        </div>
        <div class="readout">
            <label>MODE</label><span id="roMode"></span>
        </div>
        <div class="readout">
            <label>ROUTING</label><span id="roRouting"></span>
        </div>
        <span id="statusText" class="status"></span>
        <button id="gearBtn" class="gear-btn" title="Settings">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </div>

    <!-- Node context menu -->
    <div id="ctxMenu" class="ctx-menu" style="display:none;">
        <div class="ctx-item" id="ctxTest">Test</div>
        <div class="ctx-item" id="ctxEdit">Edit</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item danger" id="ctxDelete">Delete</div>
    </div>

    <!-- Node add/edit modal -->
    <div id="modalOverlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="form-grid">
                <label>Name</label><input type="text" id="fName">
                <label>Protocol</label>
                <select id="fProtocol">
                    <option value="vless">vless</option>
                    <option value="btp">btp</option>
                    <option value="trojan">trojan</option>
                    <option value="socks">socks</option>
                </select>
                <label>Address</label><input type="text" id="fServer">
                <label>Port</label><input type="text" id="fPort">
                <label id="lSecret">Secret</label><input type="text" id="fSecret">
                <label>Transport</label>
                <select id="fTransport">
                    <option value="tls">tls</option>
                    <option value="xhttp">xhttp</option>
                </select>
                <label id="lAuthority">Domain (SNI/Host)</label><input type="text" id="fAuthority">
                <label id="lPath">Path</label><input type="text" id="fPath">
                <label id="lPadding">Padding range</label><input type="text" id="fPadding">
            </div>
            <div class="modal-actions">
                <button id="modalCancel" class="btn-secondary">Cancel</button>
                <button id="modalSave" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Settings card: the HTML twin of the native settings window. Nothing
         here applies until OK. -->
    <div id="settingsOverlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="form-grid">
                <label>HTTP port</label><input type="text" id="sHttpPort">
                <label>SOCKS port</label><input type="text" id="sSocksPort">
                <label>Mode</label>
                <select id="sMode">
                    <option value="direct">Direct</option>
                    <option value="proxy">Proxy</option>
                    <option value="system">System proxy</option>
                </select>
                <label>Routing</label>
                <select id="sRouting">
                    <option value="global">Global</option>
                    <option value="cn-whitelist">Bypass CN</option>
                    <option value="gfw-blacklist">Bypass GFW</option>
                </select>
            </div>
            <div class="check-grid">
                <div class="checkbox-row" id="sTunRow">
                    <input type="checkbox" id="sTun">
                    <label for="sTun">TUN mode (takes over system traffic)</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="sLAN">
                    <label for="sLAN">Allow LAN access</label>
                </div>
                <div class="checkbox-row" id="sLoginRow" style="display:none;">
                    <input type="checkbox" id="sLogin">
                    <label for="sLogin">Start at login</label>
                </div>
                <div class="checkbox-row" id="sTrayRow" style="display:none;">
                    <input type="checkbox" id="sTray">
                    <label for="sTray">Hide tray icon (after restart)</label>
                </div>
            </div>
            <div class="modal-actions">
                <button id="settingsCancel" class="btn-secondary">Cancel</button>
                <button id="settingsOK" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="src/app.js"></script>
</body>
</html>
