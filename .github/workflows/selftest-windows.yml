name: Windows form self-test

# The same harness macOS runs, on the platform it was written for. It is no
# longer wired into any pipeline: run it by hand here before cutting a release
# tag, or with `gh workflow run selftest-windows.yml`.
#
# windows-latest has a desktop session and ships the WebView2 runtime, which is
# the only reason a webview window can be driven in CI at all.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch rules.dat for go:embed
        # rules.dat is gitignored, but //go:embed needs it at build time.
        shell: bash
        run: |
          curl -fsSL -o rules.dat \
            https://github.com/wwricu/domain-list-community/releases/latest/download/rules.dat \
            || : > rules.dat
      - name: Drive the form windows
        shell: bash
        env:
          BADPROXY_GUI_SELFTEST: "1"
        # pipefail for the same reason as the macOS job: the harness verdict
        # must not be replaced by tee's exit code.
        run: |
          set -o pipefail
          export BADPROXY_SELFTEST_SHOTS="$RUNNER_TEMP/shots"
          mkdir -p "$BADPROXY_SELFTEST_SHOTS"
          go test -tags production -count=1 -v -timeout 15m . \
            2>&1 | tee "$BADPROXY_SELFTEST_SHOTS/selftest.log"
      - name: Collect the crash dump
        if: failure()
        shell: bash
        # A Wails/WebView2 abort leaves a WER dump rather than a stack trace in
        # stdout, and without it the only evidence is a timeout.
        run: |
          shots="$RUNNER_TEMP/shots"
          mkdir -p "$shots/wer"
          cp -a "$LOCALAPPDATA"/CrashDumps/. "$shots/wer" 2>/dev/null || true
          echo "=== WER dumps ==="; ls -la "$shots/wer"
          echo "=== harness log ==="; tail -n 150 "$shots/selftest.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-form-selftest
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
