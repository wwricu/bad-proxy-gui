name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# macos-latest has limited runner capacity, and a burst of pushes used to queue
# several copies of the same build behind each other - one commit waited 13
# minutes for a runner that its own successor had already made stale.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the Wails v3 CLI
        # Only for `wails3 generate syso`, which builds the icon/DPI-manifest
        # resource. Pin it to the library version in go.mod.
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.31
      - name: Build portable bundle
        # package-windows.sh generates the Windows resource, runs the go build
        # that v3's own task would run, and zips the exe with rules.dat and the
        # .portable marker, so the folder is movable.
        shell: bash
        run: bash package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bad-proxy-gui-windows
          path: dist/bad-proxy-gui-windows-amd64.zip
          if-no-files-found: error

  macos:
    # A compile check, not a package. Building the universal .app on every push
    # duplicated release.yml's `build-macos` step for step and was the slowest
    # job in the pipeline, but the thing worth catching on main is that darwin
    # still builds at all: cgo errors in the tray and main-thread files are
    # invisible to a Windows machine. The bundle is assembled when a tag asks
    # for it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch rules.dat for go:embed
        # rules.dat is gitignored, but //go:embed needs it at build time.
        run: |
          curl -fsSL -o rules.dat \
            https://github.com/wwricu/domain-list-community/releases/latest/download/rules.dat \
            || : > rules.dat
      - name: Compile both mac architectures
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p build
          # -tags production is not an optimisation, it is the only build that
          # has a window: without it the Wails backend resolves to a stub whose
          # CreateApp returns an error, so the binary compiles, links and exits -
          # a double-click on the .app does nothing.
          GOOS=darwin GOARCH=arm64 go build -tags production -o build/bad-proxy-gui-arm64 .
          GOOS=darwin GOARCH=amd64 go build -tags production -o build/bad-proxy-gui-amd64 .

