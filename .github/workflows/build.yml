name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout bad-proxy-core (embedded engine)
        uses: actions/checkout@v4
        with:
          repository: wwricu/bad-proxy-core
          path: bad-proxy-core
          ref: dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install MinGW-w64 (gcc for Fyne CGO)
        run: choco install mingw -y
      - name: Point core replace at the in-workspace checkout
        run: go mod edit -replace github.com/wwricu/bad-proxy-core=./bad-proxy-core
      - name: Build exe
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          go env -w CGO_ENABLED=1
          mkdir build
          go build -trimpath -ldflags "-s -w -H windowsgui" -o build/bad-proxy-gui.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: bad-proxy-gui-windows
          path: build/bad-proxy-gui.exe

  macos:
    # Universal .app bundle. Kept non-blocking in CI so a Windows-only change
    # never reddens the pipeline on a mac packaging quirk.
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout bad-proxy-core (embedded engine)
        uses: actions/checkout@v4
        with:
          repository: wwricu/bad-proxy-core
          path: bad-proxy-core
          ref: dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Point core replace at the in-workspace checkout
        run: go mod edit -replace github.com/wwricu/bad-proxy-core=./bad-proxy-core
      - name: Build universal binary
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p build
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o build/bad-proxy-gui-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o build/bad-proxy-gui-amd64 .
          lipo -create -output build/bad-proxy-gui-universal build/bad-proxy-gui-arm64 build/bad-proxy-gui-amd64
      - name: Assemble .app bundle
        run: |
          APP="build/Bad Proxy.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/bad-proxy-gui-universal "$APP/Contents/MacOS/bad-proxy-gui"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleName</key><string>Bad Proxy</string>' \
            '<key>CFBundleExecutable</key><string>bad-proxy-gui</string>' \
            '<key>CFBundleIdentifier</key><string>icu.wwr.badproxy.gui</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>CFBundleShortVersionString</key><string>0.0.1-beta-1</string>' \
            '<key>CFBundleVersion</key><string>1</string>' \
            '<key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '<key>NSHighResolutionCapable</key><true/>' \
            '<key>LSUIElement</key><true/>' \
            '</dict></plist>' > "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          cd build && ditto -c -k --keepParent --sequesterRsrc "Bad Proxy.app" bad-proxy-gui-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bad-proxy-gui-macos
          path: build/bad-proxy-gui-macos.zip

