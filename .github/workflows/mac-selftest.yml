name: macOS form self-test

# The form-window harness needs a window server, so it cannot run on this
# machine. It is no longer wired into any pipeline: run it by hand here, or with
# `gh workflow run mac-selftest.yml`, before cutting a release tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch rules.dat for go:embed
        # rules.dat is gitignored, but //go:embed needs it at build time.
        run: |
          curl -fsSL -o rules.dat \
            https://github.com/wwricu/domain-list-community/releases/latest/download/rules.dat \
            || : > rules.dat
      - name: Drive the form windows
        env:
          BADPROXY_GUI_SELFTEST: "1"
        # RUNNER_TEMP is only an environment variable, so the shots directory is
        # exported from here rather than from a workflow expression. pipefail: the
        # harness result must not be hidden by tee's own exit code.
        run: |
          set -o pipefail
          export BADPROXY_SELFTEST_SHOTS="$RUNNER_TEMP/shots"
          mkdir -p "$BADPROXY_SELFTEST_SHOTS"
          go test -tags production -count=1 -v -timeout 15m . \
            2>&1 | tee "$BADPROXY_SELFTEST_SHOTS/selftest.log"
      - name: Collect crash reports
        if: always()
        # An NSException aborts the process and the reason lands in stderr and in
        # the crash report, neither of which the job log shows by itself.
        run: |
          shots="$RUNNER_TEMP/shots"
          mkdir -p "$shots/crashreports"
          cp -a "$HOME/Library/Logs/DiagnosticReports/." "$shots/crashreports" 2>/dev/null || true
          echo "=== crash reports ==="; ls -la "$shots/crashreports"
          echo "=== harness log ==="; tail -n 150 "$shots/selftest.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-form-selftest
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
