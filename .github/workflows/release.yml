name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The behavioural gate, ahead of any packaging. A binary that compiles, links
  # and signs is not evidence that opening a window works: that gap is how the
  # macOS editor crash - a form window that aborts the process the moment it is
  # created - went out as a release, because nothing between the commit and the
  # download ever opened one on a Mac.
  #
  # Both platforms gate the publish, so a release is good on both or it is not
  # published at all. The alternative, shipping the platform that passed and
  # noting the other in the release text, is what let one platform quietly rot.
  selftest-windows:
    uses: ./.github/workflows/selftest-windows.yml
  selftest-macos:
    uses: ./.github/workflows/mac-selftest.yml

  build-windows:
    needs: selftest-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the Wails v3 CLI
        # Only for `wails3 generate syso`, which builds the icon/DPI-manifest
        # resource. Pin it to the library version in go.mod.
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.31
      - name: Build portable bundle
        shell: bash
        run: bash package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/bad-proxy-gui-windows-amd64.zip
            dist/bad-proxy-gui-windows-amd64.exe
          if-no-files-found: error

  build-macos:
    needs: selftest-macos
    # Universal (arm64 + x86_64) .app bundle, ad-hoc signed so it launches on
    # the downloader's Mac after they clear the quarantine flag.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch rules.dat for go:embed
        # rules.dat is gitignored, but //go:embed needs it at build time.
        run: |
          curl -fsSL -o rules.dat \
            https://github.com/wwricu/domain-list-community/releases/latest/download/rules.dat \
            || : > rules.dat
      - name: Build universal binary
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p build
          # -tags production: without it the Wails backend is a stub that errors
          # out at startup, so the .app opens nothing. Keep in step with build.yml.
          GOOS=darwin GOARCH=arm64 go build -tags production -trimpath -ldflags "-s -w" -o build/bad-proxy-gui-arm64 .
          GOOS=darwin GOARCH=amd64 go build -tags production -trimpath -ldflags "-s -w" -o build/bad-proxy-gui-amd64 .
          lipo -create -output build/bad-proxy-gui-universal build/bad-proxy-gui-arm64 build/bad-proxy-gui-amd64
          lipo -info build/bad-proxy-gui-universal
      - name: Assemble .app bundle
        run: |
          APP="build/Bad Proxy.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/bad-proxy-gui-universal "$APP/Contents/MacOS/bad-proxy-gui"
          curl -fsSL -o "$APP/Contents/Resources/rules.dat" \
            https://github.com/wwricu/domain-list-community/releases/latest/download/rules.dat
          # Dock icon, built here from the tray png so the two cannot drift.
          # Without AppIcon.icns plus CFBundleIconFile the Finder shows a blank.
          ICONSET=build/AppIcon.iconset
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z "$sz" "$sz" build/appicon.png --out "$ICONSET/icon_${sz}x${sz}.png" > /dev/null
            sips -z "$((sz * 2))" "$((sz * 2))" build/appicon.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Bad Proxy</string>
            <key>CFBundleDisplayName</key><string>Bad Proxy</string>
            <key>CFBundleExecutable</key><string>bad-proxy-gui</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIdentifier</key><string>icu.wwr.badproxy.gui</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>0.0.1-beta-6</string>
            <key>CFBundleShortVersionString</key><string>0.0.1-beta-6</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>LSUIElement</key><false/>
          </dict>
          </plist>
          PLIST
      - name: Ad-hoc codesign
        run: codesign --force --deep -s - "build/Bad Proxy.app"
      - name: Zip bundle
        run: cd build && ditto -c -k --keepParent --sequesterRsrc "Bad Proxy.app" bad-proxy-gui-darwin-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/bad-proxy-gui-darwin-universal.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, selftest-windows, selftest-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        # Both softprops/action-gh-release ("Too many retries.") and gh CLI
        # (exit 1, logs unseeable) failed publishing blind. Talk to the REST
        # API directly and print every response body into the job log, so the
        # next failure is diagnosable from the Actions page itself.
        env:
          AUTH: Bearer ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          UP="https://uploads.github.com/repos/$GITHUB_REPOSITORY"
          stale=$(curl -s -H "Authorization: $AUTH" "$API/releases/tags/$GITHUB_REF_NAME" | jq -r '.id // empty')
          if [ -n "$stale" ]; then
            echo "removing stale release $stale"
            curl -s -X DELETE -H "Authorization: $AUTH" "$API/releases/$stale" > /dev/null
          fi
          resp=$(curl -s -X POST -H "Authorization: $AUTH" -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\",\"prerelease\":true,\"generate_release_notes\":true,\"target_commitish\":\"$GITHUB_SHA\"}" \
            "$API/releases")
          rid=$(echo "$resp" | jq -r '.id // empty')
          if [ -z "$rid" ]; then
            echo "release create failed:" >&2
            echo "$resp" >&2
            exit 1
          fi
          for f in dist/*; do
            echo "uploading $(basename "$f")"
            upt=$(curl -s -X POST -H "Authorization: $AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$UP/releases/$rid/assets?name=$(basename "$f")")
            if ! echo "$upt" | jq -e '.id' > /dev/null; then
              echo "upload failed:" >&2
              echo "$upt" >&2
              exit 1
            fi
          done
          echo "published release $rid"
