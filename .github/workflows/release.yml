name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout bad-proxy-core (embedded engine)
        uses: actions/checkout@v4
        with:
          repository: wwricu/bad-proxy-core
          path: bad-proxy-core
          ref: dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Point core replace at the in-workspace checkout
        run: go mod edit -replace github.com/wwricu/bad-proxy-core=./bad-proxy-core
      - name: Build portable bundle
        shell: bash
        run: bash package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/bad-proxy-gui-windows-amd64.zip
          if-no-files-found: error

  build-macos:
    # Universal (arm64 + x86_64) .app bundle, ad-hoc signed so it launches on
    # the downloader's Mac after they clear the quarantine flag.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout bad-proxy-core (embedded engine)
        uses: actions/checkout@v4
        with:
          repository: wwricu/bad-proxy-core
          path: bad-proxy-core
          ref: dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Point core replace at the in-workspace checkout
        run: go mod edit -replace github.com/wwricu/bad-proxy-core=./bad-proxy-core
      - name: Fetch rules.dat for go:embed
        # rules.dat is gitignored, but //go:embed needs it at build time.
        run: |
          curl -fsSL -o rules.dat \
            https://github.com/wwricu/domain-list-community/releases/latest/download/rules.dat \
            || : > rules.dat
      - name: Build universal binary
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p build
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o build/bad-proxy-gui-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o build/bad-proxy-gui-amd64 .
          lipo -create -output build/bad-proxy-gui-universal build/bad-proxy-gui-arm64 build/bad-proxy-gui-amd64
          lipo -info build/bad-proxy-gui-universal
      - name: Assemble .app bundle
        run: |
          APP="build/Bad Proxy.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/bad-proxy-gui-universal "$APP/Contents/MacOS/bad-proxy-gui"
          curl -fsSL -o "$APP/Contents/Resources/rules.dat" \
            https://github.com/wwricu/domain-list-community/releases/latest/download/rules.dat
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Bad Proxy</string>
            <key>CFBundleDisplayName</key><string>Bad Proxy</string>
            <key>CFBundleExecutable</key><string>bad-proxy-gui</string>
            <key>CFBundleIdentifier</key><string>icu.wwr.badproxy.gui</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>0.0.1-beta-3</string>
            <key>CFBundleShortVersionString</key><string>0.0.1-beta-3</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>LSUIElement</key><false/>
          </dict>
          </plist>
          PLIST
      - name: Ad-hoc codesign
        run: codesign --force --deep -s - "build/Bad Proxy.app"
      - name: Zip bundle
        run: cd build && ditto -c -k --keepParent --sequesterRsrc "Bad Proxy.app" bad-proxy-gui-darwin-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/bad-proxy-gui-darwin-universal.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: false
