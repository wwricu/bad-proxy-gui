<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <!-- The app icon's source of truth: render-icon.sh turns this into
         build/appicon.png, which becomes the macOS .icns and the non-Windows
         tray icon, and build/windows/icon.ico is generated from that png.

         Full bleed on purpose. The Wails default shipped a small white tile
         with a drop shadow floating in a transparent canvas, which reads as a
         postage stamp on the taskbar and in the Dock.

         The hairline is what keeps a white tile visible on a light background
         (file explorer, launchpad); without it only the letter survives.

         Glyph placement is measured off the rendered png rather than guessed:
         text-anchor centres the advance width, and this letter has side
         bearings. At these coordinates the ink is 527x629 with an even 249px
         either side and 198px above and below. -->
    <rect x="4" y="4" width="1016" height="1016" rx="198" fill="#ffffff"
          stroke="#dfe2e6" stroke-width="8"/>
    <text x="502" y="522" text-anchor="middle" dominant-baseline="central"
          font-family="Arial, 'Segoe UI', sans-serif" font-weight="700"
          font-size="880" fill="#111111">B</text>
</svg>
