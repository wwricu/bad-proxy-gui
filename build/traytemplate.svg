<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
    <!-- The macOS menu-bar icon's source of truth: render-icon.sh turns this
         into build/traytemplate.png, which tray_darwin.go hands to AppKit as a
         template image. The png is checked by TestTrayTemplateIsPaddedAndBlack,
         so re-render here rather than editing the png: a png that drifts from
         this file is undone the next time the script runs.

         Two things the app icon cannot do here. A full-bleed tile has no
         transparent margin, so nothing separates the letter from the edges of
         the bar; and a coloured tile stays coloured in dark mode. So this
         canvas is transparent outside the glyph and the glyph is flat black,
         which is what a template image is masked from: the system draws it in
         whatever colour the bar needs.

         The ink is measured, not guessed: tray_darwin.m draws this square
         canvas 18 pt on a side, so the padding baked in here decides how much
         of the bar's thickness the letter actually takes. At font-size 128 the
         letter is 78x92 of 144, which reads as the 11.5 pt that leaves - a
         little under the system's own menu-bar symbols, because the letter has
         no surrounding frame to make up the rest. -->
    <text x="71" y="74" text-anchor="middle" dominant-baseline="central"
          font-family="Arial, 'Segoe UI', sans-serif" font-weight="700"
          font-size="128" fill="#000000">B</text>
</svg>
